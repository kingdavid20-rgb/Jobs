<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Results - CHAINZ WEARS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{font-family:Arial, sans-serif;background:#f5f5f5;margin:0;padding:20px}
        .results{max-width:1200px;margin:0 auto}
        .product{background:#fff;padding:12px;border-radius:8px;border:1px solid #eee;display:flex;gap:12px;align-items:center}
        .product img{width:120px;height:80px;object-fit:cover;border-radius:6px}
        .web-iframe{width:100%;height:600px;border:none;border-radius:8px;margin-top:12px}
    </style>
</head>
<body>
    <div class="results">
        <h2>Search Results</h2>
        <div id="localResults"></div>
        <h3 style="margin-top:18px">Images from the web</h3>
        <p>Below are visual results sourced from Unsplash for broader matching images (opens inside this page).</p>
        <iframe id="webFrame" class="web-iframe"></iframe>
        <p style="margin-top:12px;color:#666">If the iframe doesn't load, <a id="externalLink" href="#" target="_blank">open the Unsplash search in a new tab</a>.</p>
        <p style="margin-top:18px;"><a href="welcome.html" class="btn btn-secondary">Back to Shop</a></p>
    </div>
    <script>
        function getQuery() { const params = new URLSearchParams(location.search); return params.get('q') || '' }
        const q = getQuery();
        document.title = q ? `Search: ${q} - CHAINZ WEARS` : 'Search - CHAINZ WEARS';

        const products = [
            { name: "Classic Leather Tote", category: "Bags", price: "$120.00", image: "https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=200&h=150&fit=crop" },
            { name: "Designer Satchel", category: "Bags", price: "$185.00", image: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=200&h=150&fit=crop" },
            { name: "Classic Black Belt", category: "Belts", price: "$45.00", image: "https://images.unsplash.com/photo-1624222247344-550fb60583dc?w=200&h=150&fit=crop" },
            { name: "Classic Bomber Jacket", category: "Jackets", price: "$350.00", image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200&h=150&fit=crop" }
        ];

        const local = products.filter(p => p.name.toLowerCase().includes(q.toLowerCase()) || p.category.toLowerCase().includes(q.toLowerCase()));
        const localDiv = document.getElementById('localResults');
        if (local.length) {
            local.forEach(p => {
                const el = document.createElement('div'); el.className='product';
                el.innerHTML = `<img src="${p.image}" alt=""><div><strong>${p.name}</strong><div style="color:#27ae60;font-weight:700">${p.price}</div><div style="color:#666;margin-top:6px">Category: ${p.category}</div></div>`;
                localDiv.appendChild(el);
            })
        } else {
            localDiv.innerHTML = '<div style="padding:12px;background:#fff;border-radius:8px;border:1px solid #eee;">No matching local products.</div>'
        }

        // Unsplash search URL
        const unsplash = 'https://unsplash.com/s/photos/' + encodeURIComponent(q);
        const iframe = document.getElementById('webFrame');
        iframe.src = unsplash;
        document.getElementById('externalLink').href = unsplash;
    </script>
    <script src="local-image-replacer.js"></script>
</body>
</html>
